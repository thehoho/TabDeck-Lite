name: Bug report
description: Report a reproducible TapDeck Lite problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve TapDeck Lite. Do not include private messages or saved phrases.
  - type: input
    id: version
    attributes:
      label: TapDeck Lite version
      placeholder: 1.0.1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Oppo Reno 14 Lite, Android 16
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: App where the keyboard was used
      options:
        - Discord
        - WhatsApp
        - Another app
        - Companion settings app
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use placeholder text instead of private message content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
